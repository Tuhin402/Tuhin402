name: Generate GitHub Profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # -----------------------------------------------
      # Checkout repository
      # -----------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------
      # Setup Python
      # -----------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------
      # Install dependencies
      # -----------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------------------------
      # Provide GitHub token to existing application
      # -----------------------------------------------

      - name: Generate profile
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GENERATOR_TOKEN }}
        run: |
          python build.py

      # -----------------------------------------------
      # Commit generated files
      # -----------------------------------------------

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/ README.md

          git diff --cached --quiet || git commit -m "chore: update generated profile"

          git push
